[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cifar"
version = "0.1.0"
description = "From-scratch CIFAR-10 classifier (CS231n final project)"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

# src-layout: the importable package lives under src/
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
